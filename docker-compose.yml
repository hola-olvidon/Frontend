services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hola-olvidon-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_LOG_LEVEL=info
      - NODE_ENV=production
